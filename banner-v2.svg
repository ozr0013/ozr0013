<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Omar Rizwan — full-stack engineer, web agents, RAG systems">
  <defs>
    <pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>

    <radialGradient id="vignette" cx="18%" cy="50%" r="85%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1280" height="300" fill="url(#vignette)"/></mask>

    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF5A1F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <style>
      .name {
        font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 58px; font-weight: 600; letter-spacing: -1.6px; fill: #F4F4F1;
        opacity: 0; animation: rise 900ms cubic-bezier(.2,.7,.3,1) 250ms forwards;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px; letter-spacing: 0.3px; fill: #5F5F5A;
        opacity: 0; animation: fade 900ms ease-out 1050ms forwards;
      }
      .mark {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px; letter-spacing: 1px; fill: #3C3C39;
        opacity: 0; animation: fade 900ms ease-out 1250ms forwards;
      }
      .line {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 17px; letter-spacing: 0.4px; fill: #8E8E88;
        opacity: 0; animation: cycle 13.5s linear 950ms infinite;
      }
      .line:nth-of-type(2) { animation-delay: 5450ms; }
      .line:nth-of-type(3) { animation-delay: 9950ms; }

      .cursor { fill: #FF5A1F; opacity: 0;
        animation: fade 200ms linear 950ms forwards, blink 1.1s steps(1) 950ms infinite; }
      .rule { fill: #FF5A1F; transform-origin: 88px 105px;
        transform: scaleX(0); animation: draw 700ms cubic-bezier(.2,.7,.3,1) forwards; }
      .base { fill: #FF5A1F; opacity: 0; animation: fade 1.2s ease-out 1400ms forwards; }

      .dots  { animation: drift 34s linear infinite; }
      .glow  { animation: breathe 11s ease-in-out infinite; transform-origin: center; }
      .sweep { animation: sweep 9s ease-in-out 2s infinite; }

      .edge { stroke: #FF5A1F; stroke-opacity: 0.22; stroke-width: 1; }
      .node { fill: #FF5A1F; }
      .n1 { animation: pulse 4.4s ease-in-out infinite; }
      .n2 { animation: pulse 4.4s ease-in-out 1.1s infinite; }
      .n3 { animation: pulse 4.4s ease-in-out 2.2s infinite; }
      .n4 { animation: pulse 4.4s ease-in-out 3.3s infinite; }
      .n5 { animation: pulse 4.4s ease-in-out 0.6s infinite; }

      @keyframes rise { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
      @keyframes fade { to { opacity: 1; } }
      @keyframes draw { to { transform: scaleX(1); } }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-26px,-26px); } }
      @keyframes breathe { 0%,100% { opacity:.55; transform: scale(1); } 50% { opacity:1; transform: scale(1.12); } }
      @keyframes sweep { 0% { transform: translateX(-720px);} 60%,100% { transform: translateX(1440px);} }
      @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:.95; } }
      @keyframes cycle {
        0%   { opacity:0; transform: translateY(6px); }
        3%   { opacity:1; transform: translateY(0); }
        30%  { opacity:1; transform: translateY(0); }
        34%  { opacity:0; transform: translateY(-6px); }
        100% { opacity:0; transform: translateY(-6px); }
      }
    </style>
  </defs>

  <rect width="1280" height="300" fill="#08080A"/>
  <ellipse class="glow" cx="1000" cy="120" rx="420" ry="260" fill="url(#ember)"/>

  <g mask="url(#fade)">
    <rect class="dots" x="-26" y="-26" width="1332" height="352" fill="url(#dots)"/>
  </g>

  <!-- agent graph motif -->
  <g mask="url(#fade)" opacity="0.9">
    <g class="edge">
      <line x1="880" y1="80"  x2="985" y2="140"/>
      <line x1="985" y1="140" x2="1092" y2="96"/>
      <line x1="985" y1="140" x2="1046" y2="222"/>
      <line x1="1092" y1="96" x2="1178" y2="166"/>
      <line x1="1046" y1="222" x2="1178" y2="166"/>
    </g>
    <circle class="node n1" cx="880"  cy="80"  r="3.2"/>
    <circle class="node n2" cx="985"  cy="140" r="4.2"/>
    <circle class="node n3" cx="1092" cy="96"  r="3.2"/>
    <circle class="node n4" cx="1046" cy="222" r="3.2"/>
    <circle class="node n5" cx="1178" cy="166" r="3.2"/>
  </g>

  <rect class="sweep" x="-360" y="0" width="360" height="300" fill="url(#sheen)"/>

  <rect class="rule" x="88" y="104" width="34" height="2"/>
  <text class="name" x="88" y="164">Omar Rizwan</text>

  <text class="line" x="88" y="206">full-stack engineer · web agents · rag systems</text>
  <text class="line" x="88" y="206">shipping b2b saas on angular + asp.net core</text>
  <text class="line" x="88" y="206">training agents against their own failure rates</text>
  <rect class="cursor" x="64" y="193" width="9" height="17"/>

  <text class="meta" x="88" y="240">salt lake city · cs @ utah · spark lab</text>
  <text class="mark" x="1192" y="272">ozr0013</text>

  <rect class="base" x="0" y="297" width="1280" height="3" fill-opacity="0.55"/>
</svg>
